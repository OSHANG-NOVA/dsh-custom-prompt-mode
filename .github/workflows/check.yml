name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check every JavaScript entry
        run: |
          for file in index.js persona.js gate.js client.js; do
            echo "node --check $file"
            node --check "$file"
          done

      - name: Validate JSON metadata
        run: |
          for file in package.json locale/zh.json locale/en.json; do
            echo "parse $file"
            node -e "JSON.parse(require('node:fs').readFileSync('$file','utf8'))"
          done

      - name: Reject replacement characters
        run: |
          if grep -rlP '\x{FFFD}' --include='*.js' --include='*.json' --include='*.md' --include='*.yml' .; then
            echo '::error::replacement characters found, a file was written with the wrong encoding'
            exit 1
          fi
          echo 'no replacement characters'

      - name: Pack dry run
        run: npm pack --dry-run
